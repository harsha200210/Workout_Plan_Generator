<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Schedules</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .header-container {
            position: relative;
            width: 100%;
            height: 50vh;
            background: url('assets/image/meal.jpg') no-repeat center center/cover;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5); /* Dark overlay effect */
        }

    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">TRAINING <span class="text-danger">STUDIO</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="schedules.html">Schedules</a></li>
                <li class="nav-item"><a class="nav-link" href="trainers.html">Trainers</a></li>
                <li class="nav-item"><a class="nav-link" href="places.html">Places</a></li>
                <li class="nav-item"><a class="nav-link" href="mealPlan.html">Meal Plan</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html#contact">Contact</a></li>
                <li class="nav-item" id="loginBtn"><a class="btn btn-outline-light me-2" href="login.html">Login</a></li>
                <li class="nav-item" id="signupBtn"><a class="btn btn-danger" href="signup.html">Sign Up</a></li>
                <li class="nav-item" id="logoutBtn"><a class="btn btn-danger" href="index.html">Log Out</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Fullscreen Header Image -->
<div class="header-container">
    <div class="overlay"></div>
</div>

<div class="container py-5">
    <div class="row text-center">
        <div class="col-md-6">
            <h3 class="fw-bold">Now Schedule</h3>
            <ul class="list-unstyled" id="nowSchedule">

            </ul>
        </div>

        <div class="col-md-6">
            <h3 class="fw-bold">Last Schedule</h3>
            <ul class="list-unstyled" id="lastSchedule">

            </ul>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    let loginBtn = $("#loginBtn");
    let signupBtn = $("#signupBtn");
    let logoutBtn = $("#logoutBtn");
    let nowSchedule = $("#nowSchedule");
    let lastSchedule = $("#lastSchedule");

    let loginOrNot = function(){
        if (localStorage.getItem("loginIn") === "true"){
            loginBtn.hide();
            signupBtn.hide();
            logoutBtn.show();
        } else {
            logoutBtn.hide();
            loginBtn.show();
            signupBtn.show();
        }
    }
    loginOrNot();

    let loadSchedules = function () {
        $.ajax({
            url: "http://localhost:8080/api/v1/schedules",
            method: "GET",
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("authToken")
            },
            success: function (response) {
                if (response.statusCode === 200) {
                    response.data.forEach(function (value, index) {
                        if (index === 0) {
                            value.forEach(function (value, index) {
                                if (value.length < 6) {
                                    nowSchedule.append(`<li><strong>${value}</strong></li>`);
                                } else {
                                    nowSchedule.append(`<li>${value}</li>`);
                                }
                            })
                        } else if (index === 1) {
                            value.forEach(function (value, index) {
                                if (value.length < 6) {
                                    lastSchedule.append(`<li><strong>${value}</strong></li>`);
                                } else {
                                    lastSchedule.append(`<li>${value}</li>`);
                                }
                            })
                        }
                    })
                }
            },
            error: function (error) {
                console.error(error);
            }
        })
    }
    loadSchedules();
</script>
</body>
</html>
