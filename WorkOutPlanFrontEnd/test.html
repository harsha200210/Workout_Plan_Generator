<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Exercise Modal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.js"></script>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/smoothness/jquery-ui.css">
</head>
<body>

<!-- Modal -->
<div class="modal fade" id="updateModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="updateModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-4" id="updateModalLabel">Update Exercise</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Search Input -->
                <div class="mb-3 position-relative">
                    <label class="form-label">Search Exercise</label>
                    <input type="text" class="form-control" id="exerciseSearch" placeholder="Search exercise...">
                    <ul class="list-group position-absolute w-100" id="exerciseList" style="display: none; max-height: 200px; overflow-y: auto;"></ul>
                </div>

                <div class="mb-3">
                    <label for="updateExerciseName" class="form-label">Exercise Name</label>
                    <input type="text" class="form-control" id="updateExerciseName" placeholder="Enter exercise name">
                </div>

                <!-- Dropdown for Body Part Selection -->
                <div class="mb-3">
                    <label class="form-label">Body Part</label>
                    <div class="dropdown">
                        <button class="btn btn-secondary dropdown-toggle w-100 text-start" type="button" id="updateBodyPartDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            Select Body Part
                        </button>
                        <ul class="dropdown-menu w-100" id="updateBodyPartMenu">
                            <li><button class="dropdown-item text-secondary" data-value="Chest" onclick="setBodyPart('Chest')">Chest</button></li>
                            <li><button class="dropdown-item text-secondary" data-value="Shoulders" onclick="setBodyPart('Shoulders')">Shoulders</button></li>
                            <li><button class="dropdown-item text-secondary" data-value="Triceps" onclick="setBodyPart('Triceps')">Triceps</button></li>
                            <li><button class="dropdown-item text-secondary" data-value="Biceps" onclick="setBodyPart('Biceps')">Biceps</button></li>
                            <li><button class="dropdown-item text-secondary" data-value="Back" onclick="setBodyPart('Back')">Back</button></li>
                            <li><button class="dropdown-item text-secondary" data-value="Legs" onclick="setBodyPart('Legs')">Legs</button></li>
                        </ul>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="updateYoutubeLink" class="form-label">Add Youtube Link</label>
                    <input type="url" class="form-control" id="updateYoutubeLink" placeholder="Enter YouTube link">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="exerciseUpdateBtn">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Button to Open Modal -->
<div class="container mt-5">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#updateModal">
        Open Update Modal
    </button>
</div>

<script>
    $(document).ready(function () {
        const exercises = [
            "Bench Press", "Squats", "Deadlifts", "Pull-ups", "Push-ups",
            "Bicep Curls", "Triceps Dips", "Lunges", "Planks", "Lat Pulldown",
            "Leg Press", "Overhead Press", "Dumbbell Rows", "Hammer Curls"
        ];

        // Handle typing in the search input
        $("#exerciseSearch").on("input", function () {
            let searchText = $(this).val().toLowerCase();
            let filteredExercises = exercises.filter(ex => ex.toLowerCase().includes(searchText));

            let $exerciseList = $("#exerciseList");
            $exerciseList.empty(); // Clear previous suggestions

            if (searchText.length > 0 && filteredExercises.length > 0) {
                filteredExercises.forEach(exercise => {
                    $exerciseList.append(`<li class="list-group-item search-result">${exercise}</li>`);
                });
                $exerciseList.show(); // Show list
            } else {
                $exerciseList.hide(); // Hide if no results
            }
        });

        // Handle selecting an exercise
        $(document).on("click", ".search-result", function () {
            $("#exerciseSearch").val($(this).text()); // Set selected value
            $("#updateExerciseName").val($(this).text()); // Set in Exercise Name input
            $("#exerciseList").hide(); // Hide suggestions
        });

        // Hide suggestions when clicking outside
        $(document).on("click", function (event) {
            if (!$(event.target).closest("#exerciseSearch, #exerciseList").length) {
                $("#exerciseList").hide();
            }
        });
    });
</script>

</body>
</html>
