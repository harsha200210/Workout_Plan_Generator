<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness Goal Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .option:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-dark">
    <div class="slider-step">
        <h3 class="fw-bold fs-1">Preferred Workout Duration</h3><br>
        <div class="option" onclick="selectPlan(2)">
            <span class="fw-semibold fs-3">2 Day Plan</span>
        </div>
        <div class="option" onclick="selectPlan(3)">
            <span class="fw-semibold fs-3">3 Day Plan</span>
        </div>
    </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function selectPlan(days) {
        if (days === 2) {
            window.location.href = "2DayPlan.html";
        } else {
            window.location.href = "3DayPlan.html";
        }
    }
</script>
</body>
</html>
