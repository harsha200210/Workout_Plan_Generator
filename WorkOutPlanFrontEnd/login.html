<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gym Training Studio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative; /* Required for pseudo-element */
            background: none; /* Remove direct background */
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('assets/image/Login.jpg') no-repeat center center/cover;
            opacity: 0.5; /* Adjust opacity here (0.0 to 1.0) */
            z-index: -1; /* Keeps it behind content */
        }

        .login-container {
            background: rgba(0, 0, 0, 0.7);
            padding: 2rem;
            border-radius: 10px;
            color: white;
            width: 100%;
            max-width: 400px;
            position: relative; /* Ensure content is above the background */
        }

    </style>
</head>
<body>
<div class="login-container text-center">
    <h2 class="mb-3">Login to <span class="text-danger">Gym Studio</span></h2>
    <form>
        <div class="mb-3">
            <input type="email" id="email" class="form-control" placeholder="Email" required>
        </div>
        <div class="mb-3">
            <input type="password" id="password" class="form-control" placeholder="Password" required>
        </div>
        <button type="button" id="loginBtn" class="btn btn-danger w-100">Login</button>
        <button id="googleLoginBtn" class="btn btn-light border d-flex align-items-center justify-content-center px-3 w-100 mt-3">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
                 alt="Google Logo" class="me-2" width="20">
            Sign in with Google
        </button>
    </form>
    <p class="mt-3">Don't have an account? <a href="signup.html" class="text-danger">Sign Up</a></p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script type="module" src="controllers/login.js"></script>
<script type="module" src="googleLogin.js"></script>
</body>
</html>
